<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disha — Haripriya Preview & Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes safeFlash {
      0%, 100% { background-color: #E65100; }
      50% { background-color: #BF360C; }
    }
    .animate-safe-flash {
      animation: safeFlash 1s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="root" class="max-w-md mx-auto min-h-screen bg-[#F0F4FF] shadow-2xl relative flex flex-col"></div>

  <script type="module">
    // Load all 8 language dictionaries
    const languages = ['en', 'kn', 'hi', 'ta', 'te', 'ml', 'bn', 'mr'];
    const dicts = {};

    for (const l of languages) {
      try {
        const res = await fetch(`/src/i18n/${l}.json`);
        dicts[l] = await res.json();
      } catch (err) {
        console.error('Failed loading', l, err);
      }
    }

    let currentLang = localStorage.getItem('disha_lang') || 'kn'; // default to Kannada for demo!
    let currentScreen = 's2'; // 's2', 's3', 's4'
    let alertEvent = null;

    function t(key, params = {}) {
      const dict = dicts[currentLang] || dicts['en'] || {};
      let val = dict[key] || dicts['en']?.[key] || key;
      for (const [k, v] of Object.entries(params)) {
        val = val.replace(new RegExp('\\{' + k + '\\}', 'g'), v);
      }
      return val;
    }

    function renderTermText(str) {
      return str.replace(/\[\[(.*?):(.*?)]]/g, '<span class="underline decoration-dotted font-semibold text-blue-900 cursor-pointer" onclick="showTerm(\'$1\')">$2 <span class="text-xs bg-blue-100 px-1 rounded">?</span></span>');
    }

    window.showTerm = function(id) {
      const name = t(`term.${id}.name`);
      const meaning = t(`term.${id}.meaning`);
      alert(`📖 ${name}\n\n${meaning}`);
    };

    window.setLanguage = function(l) {
      currentLang = l;
      localStorage.setItem('disha_lang', l);
      document.documentElement.lang = l;
      render();
    };

    window.navigate = function(screen, evt = null) {
      currentScreen = screen;
      alertEvent = evt;
      render();
    };

    window.triggerDemo = function(type) {
      if (type === 'platform') {
        window.navigate('s4', { type: 'platform_changed', data: { from: '3', to: '6' } });
      } else if (type === 'delay') {
        window.navigate('s4', { type: 'delayed', data: { minutes: 45, new_departure: new Date(Date.now() + 45*60000).toISOString() } });
      } else if (type === 'cancel') {
        window.navigate('s4', { type: 'cancelled', data: {} });
      } else if (type === 'cnf') {
        window.navigate('s4', { type: 'confirmed', data: { coach: 'B2', berth: '45' } });
      }
    };

    function render() {
      const root = document.getElementById('root');

      // Top control banner for tester
      const topBar = `
        <div class="bg-slate-900 text-white p-3 text-xs flex items-center justify-between sticky top-0 z-50">
          <div class="font-bold flex items-center gap-1.5">
            <span>🌐</span>
            <select onchange="window.setLanguage(this.value)" class="bg-slate-800 text-white font-semibold py-1 px-2 rounded border border-slate-700">
              ${languages.map(l => `<option value="${l}" ${currentLang === l ? 'selected' : ''}>${dicts[l]?.['lang.' + l] || l}</option>`).join('')}
            </select>
          </div>
          <div class="flex gap-1.5">
            <button onclick="window.triggerDemo('platform')" class="bg-amber-600 hover:bg-amber-500 px-2 py-1 rounded font-bold">⚠ Plat 6</button>
            <button onclick="window.triggerDemo('delay')" class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded font-bold">+45m</button>
            <button onclick="window.triggerDemo('cancel')" class="bg-red-600 hover:bg-red-500 px-2 py-1 rounded font-bold">Cancel</button>
          </div>
        </div>
      `;

      let content = '';

      if (currentScreen === 's4' && alertEvent) {
        // S4 Alert Screen
        const isPlat = alertEvent.type === 'platform_changed';
        const isDel = alertEvent.type === 'delayed';
        const isCanc = alertEvent.type === 'cancelled';
        const isCnf = alertEvent.type === 'confirmed';

        let title = 'DISHA ALERT';
        let body = '';
        let bigGraphic = '';

        if (isPlat) {
          title = 'PLATFORM CHANGED';
          bigGraphic = `<div class="font-mono text-center my-4"><span class="text-4xl line-through opacity-60">3</span> <span class="text-3xl">➔</span> <span class="text-[96px] font-black bg-white text-black px-6 py-2 rounded-2xl shadow-xl inline-block leading-none">6</span></div>`;
          body = t('alert.platform', { to: 6 });
        } else if (isDel) {
          title = 'TRAIN DELAYED';
          bigGraphic = `<div class="text-[80px] font-black leading-none text-center my-6">+45 min</div>`;
          body = t('alert.delay', { min: 45, time: '23:00' });
        } else if (isCanc) {
          title = 'TRAIN CANCELLED';
          bigGraphic = `<div class="text-7xl text-center my-6">✕</div>`;
          body = t('alert.cancelled');
        } else if (isCnf) {
          title = 'TICKET CONFIRMED';
          bigGraphic = `<div class="text-7xl text-center my-6">✔</div>`;
          body = t('alert.confirmed', { coach: 'B2', berth: '45' });
        }

        content = `
          <div class="fixed inset-0 z-40 p-6 flex flex-col justify-between text-white ${isCanc ? 'bg-red-700' : isCnf ? 'bg-green-700' : 'animate-safe-flash bg-amber-600'}">
            <div class="flex justify-between items-center">
              <span class="font-bold text-lg tracking-wider">⚠ ${t('ui.app_name')}</span>
              <button onclick="alert('Playing voice aloud...')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-1">🔊 ${t('ui.listen')}</button>
            </div>
            <div>
              <h2 class="text-3xl font-black text-center uppercase tracking-wide drop-shadow">${title}</h2>
              ${bigGraphic}
              <p class="text-2xl font-bold text-center leading-relaxed mt-4 px-2 drop-shadow">${body}</p>
              ${isCanc ? `<div class="mt-6 text-center"><button onclick="window.navigate('s3')" class="bg-white text-red-900 font-extrabold text-lg py-3.5 px-6 rounded-2xl shadow-lg hover:bg-slate-100">🧭 ${t('ui.see_other_ways')}</button></div>` : ''}
            </div>
            <div>
              <button onclick="window.navigate('s2')" class="w-full bg-white text-slate-900 font-black text-2xl py-5 rounded-2xl shadow-2xl border-4 border-black active:scale-95 transition">
                ✔ ${t('ui.got_it')}
              </button>
            </div>
          </div>
        `;
      } else if (currentScreen === 's3') {
        // S3 Backup Screen
        content = `
          <header class="bg-white p-4 border-b border-slate-200 flex items-center justify-between sticky top-12 z-20 shadow-sm">
            <div class="flex items-center gap-3">
              <button onclick="window.navigate('s2')" class="p-2 -ml-2 rounded-lg text-2xl font-bold">←</button>
              <h1 class="text-xl font-bold">${t('ui.backup_plan')}</h1>
            </div>
          </header>

          <main class="p-4 space-y-5 pb-24">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-100">
              <p class="text-base text-slate-700 font-medium">Your ticket may not confirm. Here are other ways to travel:</p>
            </div>

            <!-- Other Trains -->
            <section class="space-y-3">
              <h2 class="text-lg font-bold uppercase tracking-wide flex items-center gap-2">
                <span>🚆</span> <span>${t('ui.other_trains')}</span>
              </h2>
              <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <h3 class="font-bold text-base">12627 Karnataka Express</h3>
                    <p class="text-sm text-slate-500">Departs 21:20 · Arrives 05:10</p>
                  </div>
                  <span class="bg-green-100 text-green-800 text-xs font-bold px-2.5 py-1 rounded-full border border-green-300">✔ Available</span>
                </div>
                <a href="https://www.irctc.co.in/" target="_blank" rel="noopener" class="block text-center w-full py-2.5 bg-blue-700 text-white font-bold rounded-lg mt-2">${t('ui.book')} ↗</a>
              </div>
            </section>

            <!-- Buses -->
            <section class="space-y-3 pt-2">
              <h2 class="text-lg font-bold uppercase tracking-wide flex items-center gap-2">
                <span>🚌</span> <span>${t('ui.buses')}</span>
              </h2>
              <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
                <h3 class="font-bold text-base">KSRTC Airavat Club Class</h3>
                <p class="text-sm text-slate-500">Government inter-state express bus</p>
                <a href="https://ksrtc.in/" target="_blank" rel="noopener" class="block text-center w-full py-2.5 border-2 border-slate-300 bg-slate-50 text-slate-900 font-bold rounded-lg mt-2">${t('ui.open_site')} ↗</a>
              </div>
            </section>

            <!-- Helpline 139 -->
            <div class="text-center pt-2">
              <a href="tel:139" class="text-blue-800 font-semibold underline text-sm">📞 ${t('ui.call_139')}</a>
            </div>

            <!-- Wait Button -->
            <div class="pt-4">
              <button onclick="window.navigate('s2')" class="w-full py-4 rounded-2xl bg-slate-900 text-white font-bold text-lg shadow-lg flex items-center justify-center gap-2">
                <span>⏳</span> <span>${t('ui.wait')}</span>
              </button>
            </div>
          </main>
        `;
      } else {
        // S2 Journey Screen (Simulated with Haripriya's Kannada words)
        content = `
          <header class="bg-white p-4 border-b border-slate-200 flex items-center justify-between sticky top-12 z-20 shadow-sm">
            <h1 class="text-2xl font-black text-blue-900 tracking-tight">${t('ui.app_name')}</h1>
            <span class="text-sm bg-blue-50 text-blue-800 font-bold px-3 py-1 rounded-full border border-blue-200">${dicts[currentLang]?.['lang.' + currentLang]}</span>
          </header>

          <main class="p-4 space-y-4 pb-24">
            <!-- Ticket Status Box -->
            <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-amber-300 space-y-3">
              <div class="flex items-center gap-2">
                <span class="text-2xl">⏳</span>
                <span class="font-black text-lg text-amber-900 uppercase">NOT CONFIRMED YET</span>
              </div>
              <p class="text-xl font-bold text-slate-900 leading-snug">
                ${renderTermText(t('status.wl', { pos: 8 }))}
              </p>
              <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 text-sm font-semibold text-blue-900 flex items-center gap-2">
                <span>⏰</span>
                <span>${renderTermText(t('status.decide', { time: '6:30 PM' }))}</span>
              </div>
              <div class="text-sm text-slate-600 font-medium pt-1">
                🚆 Train 12345 (Sample Express) · Platform 3 · SBC ➔ MAS
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-2.5">
              <div class="grid grid-cols-2 gap-2">
                <button onclick="alert('🔊 Playing voice: ' + document.querySelector('p').innerText)" class="py-3 px-4 bg-white border border-slate-300 rounded-xl font-bold text-slate-800 flex items-center justify-center gap-2 shadow-sm">
                  <span>🔊</span> <span>${t('ui.listen')}</span>
                </button>
                <button onclick="window.navigate('s2')" class="py-3 px-4 bg-white border border-slate-300 rounded-xl font-bold text-slate-800 flex items-center justify-center gap-2 shadow-sm">
                  <span>🔁</span> <span>${t('ui.refresh')}</span>
                </button>
              </div>

              <button onclick="window.navigate('s3')" class="w-full py-4 px-6 bg-blue-700 hover:bg-blue-800 text-white font-extrabold text-lg rounded-2xl shadow-md flex items-center justify-center gap-2">
                <span>🧭</span> <span>${t('ui.backup_plan')}</span>
              </button>

              <button onclick="alert('Share text preview:\\nDisha — WAITING LIST\\n' + t('status.wl', {pos:8}).replace(/\\[\\[.*?:(.*?)\\]\\]/g, '$1') + '\\nTrain 12345 · PNR: ******1111\\nAlways confirm with 139.')" class="w-full py-3.5 px-4 bg-white border-2 border-slate-300 text-slate-900 font-bold rounded-2xl flex items-center justify-center gap-2 shadow-sm">
                <span>👪</span> <span>${t('ui.share')}</span>
              </button>

              <button onclick="alert('Alerts subscribed on WhatsApp & Push notifications!')" class="w-full py-3.5 px-4 bg-green-50 border border-green-300 text-green-900 font-bold rounded-2xl flex items-center justify-center gap-2 shadow-sm">
                <span>🔔</span> <span>${t('ui.alerts')}</span>
              </button>
            </div>

            <!-- Trust Note -->
            <div class="text-center text-xs text-slate-500 pt-3">
              ${t('trust.note', { ago: '2 min ago' })}
            </div>
          </main>
        `;
      }

      root.innerHTML = topBar + content;
    }

    render();
  </script>
</body>
</html>
