<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background-color: #0F172A; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="50" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="1">DISHA — SYSTEM ARCHITECTURE</text>
  <text x="50" y="78" fill="#94A3B8" font-size="14">Railway Information &amp; Multi-Channel Realtime Alert Pipeline (Design Thinking · Team 3)</text>

  <!-- FRONTEND LAYER -->
  <rect x="50" y="110" width="340" height="490" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="110" width="340" height="48" rx="16" fill="url(#primaryGrad)"/>
  <text x="75" y="141" fill="#FFFFFF" font-size="16" font-weight="700">REACT PWA CLIENT (Vercel)</text>

  <!-- Frontend Components -->
  <g transform="translate(70, 180)">
    <!-- Screens Box -->
    <rect x="0" y="0" width="300" height="100" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="15" y="24" fill="#60A5FA" font-size="13" font-weight="700">4 CORE SCREENS</text>
    <text x="15" y="46" fill="#F1F5F9" font-size="12">S1: Welcome / Phone OTP &amp; Guest</text>
    <text x="15" y="66" fill="#F1F5F9" font-size="12">S2: My Journey (Plain-Language Status)</text>
    <text x="15" y="86" fill="#F1F5F9" font-size="12">S3: Backup Plan  |  S4: Full-Screen Alert</text>

    <!-- Sheets & i18n -->
    <rect x="0" y="115" width="300" height="90" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="15" y="139" fill="#34D399" font-size="13" font-weight="700">MODAL SHEETS &amp; i18n ENGINE</text>
    <text x="15" y="161" fill="#F1F5F9" font-size="12">ShareSheet (Masked PNR) · AlertsSheet</text>
    <text x="15" y="181" fill="#F1F5F9" font-size="12">Glossary (14 terms) · 8 Static Dictionaries</text>

    <!-- Client Subsystems -->
    <rect x="0" y="220" width="300" height="85" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="15" y="244" fill="#FBBF24" font-size="13" font-weight="700">ACCESSIBILITY &amp; HARDWARE</text>
    <text x="15" y="266" fill="#F1F5F9" font-size="12">Web Speech API (Indic Speech Synthesis)</text>
    <text x="15" y="286" fill="#F1F5F9" font-size="12">Navigator Vibration · Safe Flash Animation</text>
  </g>

  <!-- COMMUNICATION CHANNELS -->
  <g transform="translate(400, 260)">
    <!-- SSE Stream -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="60,0 50,-5 50,5" fill="#F59E0B"/>
    <text x="-10" y="-12" fill="#FCD34D" font-size="11" font-weight="600">SSE Stream</text>

    <!-- HTTPS REST -->
    <line x1="60" y1="60" x2="0" y2="60" stroke="#60A5FA" stroke-width="3"/>
    <polygon points="0,60 10,55 10,65" fill="#60A5FA"/>
    <text x="-5" y="50" fill="#93C5FD" font-size="11" font-weight="600">REST API</text>
  </g>

  <!-- BACKEND LAYER -->
  <rect x="470" y="110" width="320" height="490" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="470" y="110" width="320" height="48" rx="16" fill="url(#backendGrad)"/>
  <text x="495" y="141" fill="#FFFFFF" font-size="16" font-weight="700">EXPRESS BACKEND (Render)</text>

  <!-- Backend Subsystems -->
  <g transform="translate(490, 180)">
    <rect x="0" y="0" width="280" height="80" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="15" y="24" fill="#34D399" font-size="13" font-weight="700">ROUTES &amp; VALIDATION</text>
    <text x="15" y="46" fill="#F1F5F9" font-size="12">/api/journey/:pnr (10-digit validation)</text>
    <text x="15" y="66" fill="#F1F5F9" font-size="12">/api/backup · /api/notify/subscribe</text>

    <rect x="0" y="95" width="280" height="90" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="15" y="119" fill="#60A5FA" font-size="13" font-weight="700">NORMALIZER &amp; ENGINE</text>
    <text x="15" y="141" fill="#F1F5F9" font-size="12">normalize.js (JourneyState Contract)</text>
    <text x="15" y="161" fill="#F1F5F9" font-size="12">chartTime.js (4h Charting Estimation)</text>

    <rect x="0" y="200" width="280" height="105" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="15" y="224" fill="#F59E0B" font-size="13" font-weight="700">REALTIME CHANGE PIPELINE</text>
    <text x="15" y="246" fill="#F1F5F9" font-size="12">poller.js (30s Active Interval)</text>
    <text x="15" y="266" fill="#F1F5F9" font-size="12">differ.js (State Change Detection)</text>
    <text x="15" y="286" fill="#F1F5F9" font-size="12">notifier.js (Multi-channel Fanout)</text>
  </g>

  <!-- EXTERNAL INTEGRATIONS LAYER -->
  <rect x="830" y="110" width="220" height="490" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="830" y="110" width="220" height="48" rx="16" fill="url(#alertGrad)"/>
  <text x="850" y="141" fill="#FFFFFF" font-size="16" font-weight="700">EXTERNAL SERVICES</text>

  <g transform="translate(845, 180)">
    <!-- RapidAPI -->
    <rect x="0" y="0" width="190" height="70" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="24" fill="#38BDF8" font-size="12" font-weight="700">RAPIDAPI / IRCTC</text>
    <text x="12" y="44" fill="#94A3B8" font-size="11">Live PNR &amp; Running Data</text>
    <text x="12" y="58" fill="#64748B" font-size="10">Fallback: Mock Provider</text>

    <!-- Twilio WhatsApp -->
    <rect x="0" y="85" width="190" height="70" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="109" fill="#4ADE80" font-size="12" font-weight="700">TWILIO WHATSAPP</text>
    <text x="12" y="129" fill="#94A3B8" font-size="11">WhatsApp Sandbox Alert</text>
    <text x="12" y="143" fill="#64748B" font-size="10">Localized message delivery</text>

    <!-- Firebase FCM / Auth -->
    <rect x="0" y="170" width="190" height="70" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="194" fill="#FBBF24" font-size="12" font-weight="700">FIREBASE SERVICES</text>
    <text x="12" y="214" fill="#94A3B8" font-size="11">Cloud Messaging (FCM)</text>
    <text x="12" y="228" fill="#64748B" font-size="10">Phone OTP Authentication</text>

    <!-- Booking Links -->
    <rect x="0" y="255" width="190" height="50" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="278" fill="#E2E8F0" font-size="12" font-weight="700">OFFICIAL PORTALS</text>
    <text x="12" y="294" fill="#94A3B8" font-size="10">IRCTC · KSRTC · Helpline 139</text>
  </g>
</svg>

